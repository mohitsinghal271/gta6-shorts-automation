name: GTA 6 24/7 Auto Shorts Publisher

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions tab

jobs:
  process-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System FFmpeg & Subtitle Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube OAuth Credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ] || [ -z "$YOUTUBE_CLIENT_SECRET_JSON" ]; then
            echo "::error::Missing GitHub Actions Secrets: YOUTUBE_TOKEN_JSON and YOUTUBE_CLIENT_SECRET_JSON must be configured in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$YOUTUBE_TOKEN_JSON" > youtube_token.json
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secrets.json

      - name: Verify YouTube Channel Connection
        run: |
          python cli.py channel-status

      - name: Run Livestream Discovery & Storage Cleanup
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LIVESTREAM_DISCOVERY_MOCK: "0"
        run: |
          python cli.py discover-streams --query "GTA 6" --limit 10 || true
          python cli.py recover

      - name: Generate & Publish Short to @gta-6-rampage
        env:
          YOUTUBE_DEFAULT_PRIVACY: "public"
          YOUTUBE_UPLOAD_SIMULATION: "0"
        run: |
          python generate_and_publish.py
